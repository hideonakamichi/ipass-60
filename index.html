<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">

</head>
<body>
<title>iパス 60日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#FFCCBB; --surface:#FFFFFF; --ink:#12303A; --muted:#5B4B47; --line:#EFB8A6;
  --navy:#006C84; --navy-soft:#E2E8E4; --accent:#6EB5C0; --accent-soft:#FFE6DD; --on-accent:#0B2F38;
  --ok:#2F7D4F; --ok-soft:#E3F2E8; --ng:#B83A3A; --ng-soft:#F8E3E3;
  --on-navy:#FFFFFF; --paper:#FFFFFF; --paper-dim:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B2A33; --surface:#113845; --ink:#E2E8E4; --muted:#A9C3C8; --line:#1F4C5A;
    --navy:#6EB5C0; --navy-soft:#16414F; --accent:#FFCCBB; --accent-soft:#2E3F44; --on-accent:#3A1E14;
    --ok:#6CC08C; --ok-soft:#173226; --ng:#F09A9A; --ng-soft:#3A1C1F;
    --on-navy:#0B2A33; --paper:#E9ECEF; --paper-dim:.92;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B2A33; --surface:#113845; --ink:#E2E8E4; --muted:#A9C3C8; --line:#1F4C5A;
  --navy:#6EB5C0; --navy-soft:#16414F; --accent:#FFCCBB; --accent-soft:#2E3F44; --on-accent:#3A1E14;
  --ok:#6CC08C; --ok-soft:#173226; --ng:#F09A9A; --ng-soft:#3A1C1F;
  --on-navy:#0B2A33; --paper:#E9ECEF; --paper-dim:.92;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,.num{font-family:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif}
h2{font-size:17px;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.tabular{font-variant-numeric:tabular-nums}
a{color:var(--navy)}

header.top{padding-block:20px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px;font-weight:900;color:var(--navy);letter-spacing:.02em}
header.top h1 span{color:var(--ink)}
.save{font-size:12px;color:var(--muted)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;border-radius:8px;padding:8px 4px;font-weight:700;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}

.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}

.countdown{background:var(--navy);color:var(--on-navy);border:0}
.countdown .label{color:inherit;opacity:.8}
.countdown .big{display:flex;align-items:baseline;gap:8px}
.countdown .num{font-size:52px;font-weight:900;line-height:1}
.countdown input{background:transparent;border:1px solid currentColor;border-radius:6px;padding:2px 6px;color:inherit}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{padding:14px}

.bar{height:10px;border-radius:5px;background:var(--navy-soft);position:relative}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--navy)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:60px}
.days div{background:var(--navy);border-radius:3px 3px 0 0;min-height:2px}
.days div.zero{background:var(--line)}
.days div.today{background:var(--accent);outline:1px solid var(--navy)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;min-height:44px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip:disabled{opacity:.4;cursor:default}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--navy-soft);color:var(--navy)}

.paper{background:var(--paper);border-radius:8px;border:1px solid var(--line);overflow-x:auto}
.paper img{display:block;width:100%;height:auto;opacity:var(--paper-dim)}
.paper.zoom img{width:880px;max-width:none}
.src{font-size:11px;color:var(--muted)}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ans{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 0;font-size:20px;font-weight:700}
.ans.sel{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.ans.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ans.ng{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.ans:disabled{cursor:default}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;display:flex;gap:10px;font-weight:700}
.choice b{color:var(--muted);min-width:1.2em}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}
.expl{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}

.timer{font-size:20px;font-weight:900}
.timer.low{color:var(--ng)}
.grid100{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid100 button,.grid100 a{text-align:center;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0;font-size:13px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:2px}
.grid100 button.done{background:var(--navy-soft);color:var(--navy);font-weight:700}
.grid100 button.cur{outline:3px solid var(--accent);outline-offset:1px}
.ph{padding:28px 16px;text-align:center;color:#5E6B7E;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.paper img:not([src]){display:none}
.grid100 .ok{background:var(--ok-soft);color:var(--ok)}
.grid100 .ng{background:var(--ng-soft);color:var(--ng)}

.field{display:flex;flex-direction:column;gap:4px}
.field .row{justify-content:space-between}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ng{background:var(--ng-soft);color:var(--ng)} .pill.na{background:var(--line);color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th,table.hist td{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
table.hist th:first-child,table.hist td:first-child{text-align:left}
table.hist .ng{color:var(--ng);font-weight:700}

.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan li.now{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px}
input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--navy)}
.plan .when{font-size:12px;color:var(--muted)}

.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 40px}
.overlay .inner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){ .bar>i{transition:width .3s} }
</style>

<div class="wrap">
  <header class="top">
    <h1>iパス <span>60</span>日</h1>
    <div class="save" id="save">この端末に保存しています</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">ホーム</button>

    <button role="tab" data-tab="stats" aria-selected="false">成績</button>
    <button role="tab" data-tab="plan" aria-selected="false">計画</button>
  </nav>
  <main id="view"></main>
</div>
<div class="overlay" id="ref" hidden></div>

const DEFAULT = {examDate:"2026-11-28", log:{}, plan:{}, q:{}, w:{}, mocks:[], cur:null};
let state = load();
let ref = null, timer = null, writing = Promise.resolve();

function fresh(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), {startDate: d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())});
}
function restore(s){ const st = Object.assign(fresh(), s); if(!s.startDate) st.startDate = START; return st; }
function load(){
  try{ const s = JSON.parse(localStorage.getItem("ipass60v2")||"null"); if(s) return restore(s); }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem("ipass60v2", JSON.stringify(state)); }catch(e){}
  if(!ref) return;
  clearTimeout(timer);
  setStatus("保存中…");
  timer = setTimeout(()=>{
    const body = JSON.parse(JSON.stringify(state));
    writing = writing.then(()=>ref.set(body)).then(()=>setStatus("クラウドに保存済み"))
      .catch(e=>{
        const code = e && e.code;
        if(code==="invalid_argument" || code==="not_granted" || code==="revoked"){ ref = null; setStatus("この端末に保存しています"); return; }
        setStatus(code==="quota_exceeded" ? "保存容量がいっぱいです（この端末には残っています）" : "クラウドに保存できませんでした（この端末には残っています）");
      });
  }, 800);
}

    if(snap.exists){ state = restore(JSON.parse(JSON.stringify(snap.data()))); setStatus("クラウドに保存済み"); render(); }

  }catch(e){ ref = null; }
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const md = d => (d.getMonth()+1)+"/"+d.getDate();
const today = () => ymd(new Date());
function weekNow(){
  const diff = Math.floor((parse(today()) - parse(state.startDate))/86400000);
  return Math.min(8, Math.max(1, Math.floor(diff/7)+1));
}
function weekRange(w){
  const s = addDays(parse(state.startDate), (w-1)*7);
  const e = w===8 ? parse(state.examDate) : addDays(s,6);
  return md(s)+"〜"+md(e);
}
const totalMin = () => Object.values(state.log).reduce((a,b)=>a+b,0);
const wrongIds = () => QS.filter(q=>state.q[q.id] && state.q[q.id].l===0).map(q=>q.id);
function record(q, pick){
  const r = state.q[q.id] || {c:0,w:0,l:0};
  if(pick===q.a){ r.c++; r.l=1; } else { r.w++; r.l=0; }
  state.q[q.id] = r;
}
function scoreOf(list, pickOf){
  const s = {S:[0,0],M:[0,0],T:[0,0]}; let c=0;
  list.forEach(q=>{ s[q.f][1]++; if(pickOf(q)===q.a){ s[q.f][0]++; c++; } });
  const p = k => s[k][1] ? Math.round(s[k][0]/s[k][1]*1000) : null;
  return {total: list.length ? Math.round(c/list.length*1000) : null, S:p("S"), M:p("M"), T:p("T"), c, n:list.length};
}
const passed = s => s.total>=600 && s.S>=300 && s.M>=300 && s.T>=300;
const fmt = ms => { const t=Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+":"+pad(t%60); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- tabs ---------- */
let tab = "home";
try{ tab = localStorage.getItem("ipass60-tab") || "home"; }catch(e){}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  pauseMock(); tab=b.dataset.tab; try{localStorage.setItem("ipass60-tab",tab);}catch(e){} render(); window.scrollTo(0,0);
}));

let focusKey = null;
function keyOf(el){
  if(!el || el===document.body) return null;
  if(el.id) return "#"+el.id;
  for(const a of el.attributes){ if(a.name.startsWith("data-")) return `[${a.name}="${CSS.escape(a.value)}"]`; }
  return null;
}
document.addEventListener("focusin", e=>{ if(e.target.closest("#view")) focusKey = keyOf(e.target); });
new MutationObserver(()=>{
  if(!focusKey || (document.activeElement && document.activeElement!==document.body)) return;
  let el = document.querySelector("#view "+focusKey);
  if(!el || el.disabled) el = document.querySelector("#next") || document.querySelector("#view [data-pick]:not(:disabled), #view [data-tp]:not(:disabled)");
  if(el) el.focus({preventScroll:true});
}).observe(document.getElementById("view"), {childList:true});
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  ({home:renderHome, quiz:renderQuiz, stats:renderStats, plan:renderPlan})[tab]();
}

  view = prac ? "practice" : "menu"; render(); window.scrollTo(0,0);

function startMock(y){
  state.cur = {y, ans:{}, i:1, el:0}; save(); view = "mock"; render(); window.scrollTo(0,0);

function pauseMock(){
  if(tick){ clearInterval(tick); tick=null; if(state.cur){ state.cur.el += Date.now()-tickFrom; save(); } }

function finishMock(){
  pauseMock();
  const c = state.cur; if(!c) return;
  const list = QS.filter(q=>q.y===c.y);
  list.forEach(q=>{ if(c.ans[q.n]!==undefined) record(q, c.ans[q.n]); });
  const s = scoreOf(list, q=>c.ans[q.n]);
  const res = {y:c.y, date:today(), total:s.total, S:s.S, M:s.M, T:s.T, c:s.c, min:Math.round(Math.min(c.el,MOCK_MS)/60000), ans:c.ans};
  state.mocks.push({y:res.y,date:res.date,total:res.total,S:res.S,M:res.M,T:res.T,c:res.c,min:res.min});
  state.cur = null; save();

}

    <div class="answers">${[0,1,2,3].map(i=>`<button class="ans ${k!==null&&i===q.a?"ok":""} ${k===i&&i!==q.a?"ng":""}" data-pick="${i}" ${k!==null?"disabled":""}>${KANA[i]}</button>`).join("")}</div>
    ${k!==null?`<div class="verdict ${k===q.a?"ok":"ng"}">${k===q.a?"正解":"不正解　正解は「"+KANA[q.a]+"」"}</div>
      <a class="btn" href="${dojo(q)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">過去問道場で解説を読む</a>
      <button class="btn primary" id="next">${p.i+1<p.list.length?"次の問題":"結果を見る"}</button>`:""}
    </section><button class="btn ghost" id="quit">やめてメニューへ</button></div>`;
  bindPaper(q);
  document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    const i = Number(b.dataset.pick); p.pick = i; if(i===q.a) p.right++;
    record(q,i); save(); render();
  }));
  const nx=$("#next"); if(nx) nx.addEventListener("click",()=>{ p.i++; p.pick=null; render(); window.scrollTo(0,0); });
  $("#quit").addEventListener("click",()=>{ prac=null; view="menu"; render(); });
}

function renderMock(){
  const c = state.cur, list = QS.filter(q=>q.y===c.y), q = list[c.i-1];
  const answered = Object.keys(c.ans).length;
  $("#view").innerHTML = `<div class="stack">
    <section class="card">
      <div class="row spread"><span class="tag">${Y[c.y].label} 100問通し</span><span class="timer tabular" id="clock"></span></div>
      <div class="row spread"><span class="row"><b>問${q.n}</b><span class="tag">${F[q.f]}</span></span><span class="muted tabular">解答済み ${answered} / 100</span></div>
      ${paperHtml(q)}
      <div class="answers">${[0,1,2,3].map(i=>`<button class="ans ${c.ans[q.n]===i?"sel":""}" data-pick="${i}">${KANA[i]}</button>`).join("")}</div>
      <div class="row spread"><button class="btn" id="prev" ${c.i===1?"disabled":""}>前の問題</button><button class="btn primary" id="next">${c.i<100?"次の問題":"見直しへ"}</button></div>
    </section>
    <section class="card">
      <div class="row spread"><h2>問題一覧</h2><span class="muted">•＝解答済み。押すとその問題へ</span></div>
      <div class="grid100">${list.map(x=>{ const d=c.ans[x.n]!==undefined; return `<button data-go="${x.n}" class="${d?"done":""} ${x.n===c.i?"cur":""}" aria-label="問${x.n}${d?" 解答済み":" 未解答"}${x.n===c.i?" 表示中":""}">${x.n}${d?'<span aria-hidden="true">•</span>':""}</button>`; }).join("")}</div>
      <button class="btn primary" id="finish">解答を終了して採点する</button>
      <p class="muted" style="margin:0">一時中断するときは、ほかのタブへ移るだけでOK。タイマーも止まります。</p>
    </section></div>`;
  bindPaper(q);
  const go = n => { c.i = Math.min(100,Math.max(1,n)); save(); renderMock(); window.scrollTo(0,0); };
  document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{ c.ans[q.n]=Number(b.dataset.pick); save(); renderMock(); }));
  $("#prev").addEventListener("click",()=>go(c.i-1));
  $("#next").addEventListener("click",()=>{ if(c.i<100) go(c.i+1); else $("#finish").scrollIntoView({behavior:"smooth"}); });
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.go))));
  const fin = $("#finish");
  fin.addEventListener("click",()=>{
    if(answered<100 && !fin.dataset.sure){ fin.dataset.sure="1"; fin.textContent=`未解答が${100-answered}問あります。このまま採点する`; return; }
    finishMock();
  });
  if(!tick){ tickFrom = Date.now(); tick = setInterval(drawClock, 1000); }
  drawClock();
}
function drawClock(){
  const c = state.cur, el = document.getElementById("clock");
  if(!c || !el){ return; }
  const left = MOCK_MS - (c.el + (Date.now()-tickFrom));
  el.textContent = "残り " + fmt(left);
  el.classList.toggle("low", left < 10*60*1000);
  if(left <= 0) finishMock();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) pauseMock();
  else if(tab==="quiz" && view==="mock" && state.cur && !tick){ tickFrom=Date.now(); tick=setInterval(drawClock,1000); }
});

function fieldRow(name, v, line){
  const st = v===null ? `<span class="pill na">未回答</span>` : v>=line ? `<span class="pill ok">ライン超え</span>` : `<span class="pill ng">あと${line-v}点</span>`;
  return `<div class="field"><div class="row"><b>${name}</b><span class="row"><span class="tabular">${v===null?"—":v+" 点"}</span>${st}</span></div>
    <div class="bar"><i style="width:${(v||0)/10}%"></i><span class="mark" style="left:${line/10}%"></span></div></div>`;
}
function renderResult(){
  const r = lastResult, list = QS.filter(q=>q.y===r.y);
  const wrong = list.filter(q=>r.ans[q.n]!==q.a);
  $("#view").innerHTML = `<div class="stack">
    <section class="card">
      <div class="row spread"><h2>${Y[r.y].label} 100問通しの結果</h2><span class="pill ${passed(r)?"ok":"ng"}">${passed(r)?"合格ライン超え":"ライン未達"}</span></div>
      <div class="row" style="align-items:baseline"><span class="num tabular" style="font-size:44px;font-weight:900">${r.total}</span><span>点 / 1000</span><span class="muted">（${r.c}問正解・${r.min}分）</span></div>
      ${fieldRow("総合", r.total, 600)}${fieldRow(F.S, r.S, 300)}${fieldRow(F.M, r.M, 300)}${fieldRow(F.T, r.T, 300)}
    </section>
    <section class="card">
      <h2>答え合わせ</h2>
      <div class="grid100">${list.map(q=>{ const ok=r.ans[q.n]===q.a; return `<a href="${dojo(q)}" target="_blank" rel="noopener" class="${ok?"ok":"ng"}" aria-label="問${q.n} ${ok?"正解":"不正解"}（道場の解説を開く）">${q.n}<span aria-hidden="true">${ok?"○":"×"}</span></a>`; }).join("")}</div>
      <p class="muted" style="margin:0">×が不正解・未解答（${wrong.length}問）。押すと道場の解説が開きます。</p>
      <button class="btn primary" id="toWrong" ${wrongIds().length?"":"disabled"}>間違えた問題を解き直す</button>
      <button class="btn" id="menu">メニューへ</button>
    </section></div>`;
  $("#toWrong").addEventListener("click",()=>startPractice(true));
  $("#menu").addEventListener("click",()=>{ view="menu"; render(); });
}

/* ---------- stats ---------- */
function abilityCard(){
  const answered = QS.filter(q=>state.q[q.id]);
  const s = scoreOf(answered, q=> state.q[q.id].l ? q.a : -1);
  return `<section class="card">
      <div class="row spread"><h2>分野別の実力</h2><span class="muted tabular">${answered.length} / 300問 解答済み</span></div>
      ${fieldRow("総合", s.total, 600)}${fieldRow(F.S, s.S, 300)}${fieldRow(F.M, s.M, 300)}${fieldRow(F.T, s.T, 300)}
      <p class="muted" style="margin:0">各問題の「最後の解答」で計算。オレンジの線が合格ライン（総合600点・各分野300点）です。</p>
    </section>`;
}
function renderStats(){
  const hist = state.mocks.slice().reverse();
  $("#view").innerHTML = `<div class="stack">
    <section class="card">
      <h2>100問通しの記録</h2>
      ${hist.length ? `<div style="overflow-x:auto"><table class="hist tabular"><thead><tr><th>日付・年度</th><th>総合</th><th>ストラ</th><th>マネ</th><th>テクノ</th></tr></thead><tbody>
        ${hist.map(m=>`<tr><td>${m.date.slice(5).replace("-","/")} ${Y[m.y].label.replace("年度","")}</td><td class="${m.total<600?"ng":""}">${m.total}</td><td class="${m.S<300?"ng":""}">${m.S}</td><td class="${m.M<300?"ng":""}">${m.M}</td><td class="${m.T<300?"ng":""}">${m.T}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="margin:0">まだありません。6週目から「問題」タブの100問通しで記録されます。</p>`}
    </section>
    <section class="card">
      <div class="row spread"><h2>覚えた用語</h2><span class="muted tabular">${knownTerms()} / ${TERMS.length}語</span></div>
      ${["S","M","T"].map(f=>{ const n=TERMS.filter(t=>t.f===f).length, k=knownTerms(f); return `<div class="field"><div class="row"><b>${F[f]}</b><span class="tabular">${k} / ${n}</span></div><div class="bar"><i style="width:${k/n*100}%"></i></div></div>`; }).join("")}
      <p class="muted" style="margin:0">最後に正解した用語を「覚えた」と数えています。</p>
    </section>
    ${abilityCard()}
    <p class="muted" style="margin:0">点数は正答率を1000点に換算した目安です。本番の採点方式（IRT）とは違います。</p>
  </div>`;
}

/* ---------- plan ---------- */
function renderPlan(){
  const w = weekNow(), done = PLAN.filter(p=>state.plan[p.id]).length;
  $("#view").innerHTML = `<div class="stack">
    <section class="card">
      <div class="row spread"><h2>8週間プラン</h2><span class="tabular muted">${done} / ${PLAN.length} 完了</span></div>
      <div class="bar"><i style="width:${done/PLAN.length*100}%"></i></div>
      <ul class="plan">${PLAN.map(p=>`<li class="${p.w===w?"now":""}"><input type="checkbox" id="p-${p.id}" data-plan="${p.id}" ${state.plan[p.id]?"checked":""}>
        <label for="p-${p.id}"><span class="when">第${p.w}週 ${weekRange(p.w)}${p.w===w?"（今週）":""}</span><br><b style="${state.plan[p.id]?"text-decoration:line-through;color:var(--muted)":""}">${p.t}</b><br><span class="muted">${p.d}</span></label></li>`).join("")}</ul>
    </section>
    <section class="card">
      <h2>使うもの</h2>
      <div><b>過去問</b>：このアプリ（令和6〜8年度の300問）</div>
      <div><b>解説</b>：<a href="https://www.itpassportsiken.com/" target="_blank" rel="noopener">ITパスポート過去問道場</a></div>
      <div><b>用語の理解</b>：YouTube の解説動画か、有料の講座アプリを1つだけ</div>
      <div><b>申し込み</b>：<a href="https://www3.jitec.ipa.go.jp/JitesCbt/index.html" target="_blank" rel="noopener">IPA iパス公式サイト</a></div>
    </section>
  </div>`;
  bindPlan();
}

if(tab==="quiz" && state.cur) view = "mock";
render();
</script>
